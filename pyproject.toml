[project]
name = "shop2tax"
version = "0.1.0"
description = "shop2tax – Self-hosted bookkeeping for German small businesses"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "shop2tax-api",
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.urls]
Homepage = "https://shop2tax.de"
Repository = "https://github.com/shop2tax/shop2tax"
Issues = "https://github.com/shop2tax/shop2tax/issues"

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
shop2tax-api = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = [".", "apps/api"]
python_functions = ["should_*", "test_*"]
python_classes = ["Test*"]
markers = [
    "integration: integration tests that require external services",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shop2tax"]
