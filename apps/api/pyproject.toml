[project]
name = "shop2tax-api"
version = "0.1.0"
description = "shop2tax – FastAPI Backend"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.15.0",
    "psycopg2-binary>=2.9.0",
    # HTTP Client
    "httpx>=0.28.0",
    # Monitoring
    "sentry-sdk>=2.0.0",
    # CSV Processing
    "pandas>=2.2.0",
    # File Upload
    "python-multipart>=0.0.9",
    # Rate Limiting
    "slowapi>=0.1.9",
    # Structured Logging
    "structlog>=24.0.0",
    # Google Cloud Storage (receipt files, GoBD-WORM)
    "google-cloud-storage>=2.18.0",
    # AI Document Extraction
    "pypdf>=5.0",
    "defusedxml>=0.7",
    "google-genai>=1.0",
    "openai>=1.0",
    "anthropic>=0.40",
    "aiolimiter>=1.2.1",
]

[project.urls]
Homepage = "https://shop2tax.de"
Repository = "https://github.com/shop2tax/shop2tax"
Issues = "https://github.com/shop2tax/shop2tax/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
python_functions = ["should_*"]
filterwarnings = [
    "ignore::UserWarning:google.auth._default",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "ty>=0.0.44",
    "pip-audit>=2.10.0",
]

[tool.ty.environment]
python-version = "3.12"
