# shop2tax – Production Docker Compose
# Usage: dotenvx run -- docker compose -f docker-compose.prod.yml up -d
#
# Env vars come from the host environment (e.g. the dotenvx wrapper used by the Makefile);
# the images contain no env files.
# No fallbacks — missing vars fail loud.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    restart: unless-stopped
    networks:
      - internal
    environment:
      # Required
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - NUXT_PROXY_SECRET=${NUXT_PROXY_SECRET:?NUXT_PROXY_SECRET must be set}
      - STORAGE_BACKEND=${STORAGE_BACKEND:?STORAGE_BACKEND must be set (local or gcs)}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set for Auth Mode}
      - ENVIRONMENT=production
      # Storage
      - LOCAL_STORAGE_PATH=${LOCAL_STORAGE_PATH:-/data/receipts}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/google-credentials.json
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      # Integrations (optional)
      - BILLBEE_API_KEY=${BILLBEE_API_KEY:-}
      - BILLBEE_USERNAME=${BILLBEE_USERNAME:-}
      - BILLBEE_PASSWORD=${BILLBEE_PASSWORD:-}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_SANDBOX=${PAYPAL_SANDBOX:-false}
      # AI (optional)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Monitoring (optional)
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=production
    volumes:
      - ${GOOGLE_SERVICE_ACCOUNT_KEY:-/dev/null}:/secrets/google-credentials.json:ro
      - receipt_storage:/data/receipts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
    restart: unless-stopped
    networks:
      - internal
    environment:
      - API_URL=http://api:8000
      - NUXT_PROXY_SECRET=${NUXT_PROXY_SECRET:?NUXT_PROXY_SECRET must be set}
      - NUXT_SESSION_PASSWORD=${SESSION_SECRET:?SESSION_SECRET must be set}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set}
      - NUXT_OAUTH_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - NUXT_OAUTH_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET must be set}
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  receipt_storage:
