# 🔧 Pre-commit configuration

default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  # ═══════════════════════════════════════════════════════════════════════════
  # 🐍 Python – Ruff (fast, runs on every commit)
  # ═══════════════════════════════════════════════════════════════════════════
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/

  # ═══════════════════════════════════════════════════════════════════════════
  # 📝 TypeScript/Vue – ESLint (fast, runs on every commit)
  # ═══════════════════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: pnpm --dir apps/web lint:fix
        language: system
        files: ^apps/web/.*\.(ts|tsx|vue|js|mjs)$
        pass_filenames: false

  # ═══════════════════════════════════════════════════════════════════════════
  # 💬 Commit message validation
  # ═══════════════════════════════════════════════════════════════════════════
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.21.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  # ═══════════════════════════════════════════════════════════════════════════
  # 🐢 Slow checks (pre-push only)
  # ═══════════════════════════════════════════════════════════════════════════
  - repo: local
    hooks:
      - id: typecheck-frontend
        name: vue-tsc
        entry: pnpm --dir apps/web typecheck
        language: system
        stages: [pre-push]
        pass_filenames: false
        files: ^apps/web/.*\.(ts|tsx|vue|js|mjs)$

      - id: typecheck-api
        name: ty
        entry: bash -c 'cd apps/api && uv run ty check app'
        language: system
        stages: [pre-push]
        pass_filenames: false
        files: ^apps/api/.*\.py$

      - id: test-python
        name: pytest
        entry: bash -c 'if docker compose exec -T api true 2>/dev/null; then make test; else echo "Docker not running, skipping pytest. Run make test manually."; exit 0; fi'
        language: system
        stages: [pre-push]
        pass_filenames: false
        files: ^apps/api/.*\.py$

      - id: test-frontend
        name: vitest
        entry: pnpm --dir apps/web test
        language: system
        stages: [pre-push]
        pass_filenames: false
        files: ^apps/web/.*\.(ts|tsx|vue|js|mjs)$
